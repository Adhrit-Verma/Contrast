<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrast — funnel monitoring</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23cc785c'/><path d='M8 3a5 5 0 000 10z' fill='%23141413'/></svg>">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/funnel.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to main content</a>

<header style="display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--line)">
  <span style="width:28px;height:28px;border-radius:var(--r-2);background:var(--accent);display:grid;place-items:center;flex:none">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4a8 8 0 000 16z" fill="#141413"/></svg>
  </span>
  <b style="font-family:var(--font-display);font-size:var(--fs-lg)">Contrast</b>
  <span class="dim">funnel monitoring — a private view of the public scanner's own data</span>
  <span style="margin-left:auto;display:flex;gap:var(--s-2)">
    <button class="btn sm" id="reload">Refresh</button>
    <a class="btn sm" href="/logout">Sign out</a>
  </span>
</header>

<main class="content" id="content" role="main"></main>
<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
