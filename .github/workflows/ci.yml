name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Deliberately NOT the ghcr.io/puppeteer/puppeteer container image: that
    # needs a non-root user to find its pre-baked Chrome, but GitHub's own
    # bind-mounted workspace needs root to be writable — and running Chrome
    # as root without --no-sandbox hangs rather than failing cleanly (proven
    # locally: the same container sat stuck on one test file for 20+ minutes
    # with `--user root` before this was reverted). Puppeteer's own CI docs
    # recommend exactly this instead: a plain runner, normal npm install.
    # This is also what already works on every contributor's own machine —
    # one fewer "only breaks in CI" environment to maintain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Builds the same image `docker compose build` produces on the VPS and
  # pushes it to GHCR. Deploying it is a manual `docker compose pull && up -d`
  # on the VPS (see the deploy runbook) — auto-deploying straight from here
  # would need an SSH private key stored as a repo secret, which is a real
  # security decision to make deliberately, not a default to wire in quietly.
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
