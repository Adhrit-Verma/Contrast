name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Deliberately NOT the ghcr.io/puppeteer/puppeteer container image: that
    # needs a non-root user to find its pre-baked Chrome, but GitHub's own
    # bind-mounted workspace needs root to be writable — and running Chrome
    # as root without --no-sandbox hangs rather than failing cleanly (proven
    # locally: the same container sat stuck on one test file for 20+ minutes
    # with `--user root` before this was reverted). Puppeteer's own CI docs
    # recommend exactly this instead: a plain runner, normal npm install.
    # This is also what already works on every contributor's own machine —
    # one fewer "only breaks in CI" environment to maintain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Builds the same image `docker compose build` produces on the VPS and
  # pushes it to GHCR — a build sanity-check + a copy anyone can `docker pull`
  # independently of the VPS. The `deploy` job below is what actually updates
  # the running site; this job existing on its own changes nothing there.
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rebuilds on the VPS itself from the same commit, rather than pulling the
  # GHCR image above — the VPS never needs a registry login this way, and
  # docker-compose.yml's `build: .` stays the single source of truth for how
  # the image is built. Needs three repo secrets: VPS_HOST, VPS_USER,
  # VPS_SSH_KEY (a dedicated deploy key, not a personal one — see DEPLOY.md).
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/aviatrack/contrast
            git pull origin main
            docker compose up -d --build contrast contrast-public
            docker image prune -f
            docker compose logs --tail 20
